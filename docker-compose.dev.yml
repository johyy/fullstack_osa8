services:
  app:
    image: library-front-dev
    volumes:
      - ./library-frontend:/usr/src/app
    build:
      context: ./library-frontend
      dockerfile: dev.Dockerfile
    container_name: library-frontend-dev

  server:
    image: library-back-dev
    volumes:
      - ./library-backend:/usr/src/app
    environment:
      - REDIS_URL=redis://redis:6379
    build:
      context: ./library-backend
      dockerfile: dev.Dockerfile
    container_name: library-backend-dev
    depends_on:
      - redis

  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app

  redis:
    image: redis
    ports:
      - 6379:6379
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./library-backend/redis_data:/data

volumes:
  redis_data: